lessons:
- title: Introduction to artificial intelligence – Part 1
  kind: content
  term: 1
  week: 1
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 1
  objectives:
  - Define AI and explain its history and evolution.
  - Identify and describe the main types of AI.
  - Explain common applications of AI.
- title: Introduction to artificial intelligence – Part 2
  kind: content
  term: 1
  week: 1
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 2
  objectives:
  - Explain ethical issues associated with AI.
  - Examine the potential risks and benefits of AI.
  - Discuss principles for the responsible use of AI.
- title: AI techniques and Machine Learning
  kind: content
  term: 1
  week: 1
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 3
  objectives:
  - Describe common AI techniques and their applications.
  - Explain the characteristics of intelligent systems.
  - Compare AI techniques and intelligent systems based on their applications.
  - Define Machine Learning.
  - Explain the basic principles of Machine Learning.
  - Distinguish between supervised, unsupervised and reinforcement learning.
- title: Developing AI Systems and the importance of data in AI systems – Part 1
  kind: content
  term: 1
  week: 1
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 4
  objectives:
  - Explain the stages involved in developing an AI system.
  - Identify programming languages and tools used in AI development.
  - Explain why Python is widely used in AI development.
- title: Developing AI Systems and the importance of data in AI systems – Part 2
  kind: content
  term: 1
  week: 2
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 5
  objectives:
  - Distinguish between primary and secondary data.
  - Classify different types of data including quantitative, qualitative, structured and unstructured
    data.
  - Relate the quality and type of training data to the performance and reliability of an AI system.
- title: Data collection and Data analysis
  kind: content
  term: 1
  week: 2
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 6
  objectives:
  - Use questionnaires, interviews and observation collection methods Collect data using digital forms
    and online surveys.
  - Describe data analysis.
  - List examples of tools that can be used for data analysis (machine learning, spreadsheets, DBMS…...).
  - Explain the objectives of data analysis (organise, calculate, transform, interpret…..).
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 2
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Exploring AI Concepts and Emerging technologies
  nature:
  - th
  lesson_no: 7
- title: Components of a computer and basic operations. – Part 1
  kind: content
  term: 1
  week: 2
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Description of Computer Systems
  nature:
  - th
  lesson_no: 8
  objectives:
  - Describe types of computers.
  - Describe how the computer systems function.
  - Identify input and output devices.
  - Connect correctly input, processing and output devices.
  - Power a computer using soft and warm booting.
- title: Components of a computer and basic operations. – Part 2
  kind: content
  term: 1
  week: 3
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Description of Computer Systems
  nature:
  - th
  lesson_no: 9
  objectives:
  - Transfer data/information to/from peripheral devices.
  - Enter information into a computer system.
  - Print a document.
  - Identify the hardware resources commonly required to run AI- enabled applications and explain their
    roles.
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 3
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Description of Computer Systems
  nature:
  - th
  lesson_no: 10
- title: Communication and collaboration tools
  kind: content
  term: 1
  week: 3
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Utilization of digital resources
  nature:
  - th
  lesson_no: 11
  objectives:
  - Describe communication and collaboration tools.
  - Select a suitable communication and collaboration tool for a given situation.
  - Set up a learning environment using communication and collaboration tools.
  - Share information/data over a network.
  - Participate in learning using communication and collaboration tools.
  - Communicate, collaborate and share resources using social media.
- title: 'Digital systems: manual, automated, processing, simulation and modelling – Part 1'
  kind: content
  term: 1
  week: 3
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Utilization of digital resources
  nature:
  - th
  lesson_no: 12
  objectives:
  - Describe manual and automated systems.
  - Compare manual and automated systems.
  - Describe monitoring and control systems.
  - Describe batch and online processing systems.
- title: 'Digital systems: manual, automated, processing, simulation and modelling – Part 2'
  kind: content
  term: 1
  week: 4
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Utilization of digital resources
  nature:
  - th
  lesson_no: 13
  objectives:
  - Describe simulations and modelling systems.
  - Outline the advantages and disadvantages of manual and automated systems.
  - Explain how automated systems can use AI techniques to monitor conditions, make predictions and support
    decisions.
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 4
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Utilization of digital resources
  nature:
  - th
  lesson_no: 14
- title: Computer Applications and Productivity Tools
  kind: content
  term: 1
  week: 4
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 15
  objectives:
  - Identify domains of use of general-purpose and other computing applications.
  - Exploit productivity tools such as word processors and desktop publishers.
  - Determine the use of general-purpose applications in commerce, industry, science, education, arts
    and media.
  - Accomplish tasks using productivity tools such as spreadsheets, word processors, databases and presentation
    software.
- title: Social and Economic Implications of Computers, Security of Computer Systems. – Part 1
  kind: content
  term: 1
  week: 4
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 16
  objectives:
  - Identify social and economic effects of computerisation.
  - Explain how computing affects employment, products, services, and working environments.
  - Evaluate the advantages and disadvantages of computerisation to people, organisations, and society.
  - Explain the concepts of computer system security, reliability, and resilience.
- title: Social and Economic Implications of Computers, Security of Computer Systems. – Part 2
  kind: content
  term: 1
  week: 5
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 17
  objectives:
  - Explain how confidentiality, integrity, privacy and availability contribute to computer system security.
  - Analyse the consequences of system failure, data loss, and security breaches.
  - Evaluate the social, economic, privacy and security implications of deploying AI-based systems.
- title: Computer Crimes, Professional Ethics and Conduct.
  kind: content
  term: 1
  week: 5
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 18
  objectives:
  - Define computer crime and identify common types of computer crime.
  - Explain how selected computer crimes are committed and their effects.
  - Describe measures used to prevent and combat computer crime.
  - Identify professional, ethical, and moral responsibilities in the use of information systems.
  - Explain ethical principles governing the use and management of computerised information.
  - Apply professional codes of conduct to given computing situations.
- title: Evaluation
  kind: evaluation
  term: 1
  week: 5
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
- title: Remediation
  kind: remediation
  term: 1
  week: 5
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
- title: Legislation and Global Communication, Responsible and Ethical Use of Computers – Part 1
  kind: content
  term: 1
  week: 6
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 19
  objectives:
  - Explain the purpose of laws relating to computer misuse, copyright, and data protection.
  - Analyse the effects of global communication on citizenship and cultural issues.
  - Evaluate the impact of the digital divide and promote responsible participation in the digital society.
- title: Legislation and Global Communication, Responsible and Ethical Use of Computers – Part 2
  kind: content
  term: 1
  week: 6
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 20
  objectives:
  - Examine the effects of the use of computer material on health and the workplace.
  - Differentiate between legislation and ethical issues related to the use of computers.
  - Emulate professional, ethical and moral obligations of computing.
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 6
  module: Computer Applications, Artificial Intelligence & Emerging technologies and their Socio-Economic
    Implications
  competency: Application areas of computers and evaluating the Implications of Computers
  nature:
  - th
  lesson_no: 21
- title: Computer Hardware Components and Embedded Systems – Part 1
  kind: content
  term: 1
  week: 6
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 22
  objectives:
  - Connect computer hardware components and outline the benefits and drawbacks of embedded systems.
  - Describe principal operations of peripherals including laser/3D printers, microphones, speakers, magnetic
    disks, flash memory, optical drives, touch screens and virtual headsets.
- title: Computer Hardware Components and Embedded Systems – Part 2
  kind: content
  term: 1
  week: 7
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 23
  objectives:
  - Explain the roles of internal components including motherboard, power supply, video card and sound
    card, and relate hardware devices to applications and people.
- title: Base Conversions
  kind: content
  term: 1
  week: 7
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 24
  objectives:
  - Describe common number systems and their characteristics.
  - Explain the applications of number systems in computing.
  - Determine the positional value of digits in different number systems Convert numbers between binary
    and decimal. Convert numbers between binary, octal and hexadecimal. Convert numbers between decimal,
    octal and hexadecimal.
- title: operations on Number Systems and Computer Data Units – Part 1
  kind: content
  term: 1
  week: 7
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 25
  objectives:
  - Carry out arithmetic operations in bases 2, 8, 10 and 16.
  - Distinguish kibi/kilo, mebi/mega, gibi/giga and tebi/tera.
- title: operations on Number Systems and Computer Data Units – Part 2
  kind: content
  term: 1
  week: 7
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 26
  objectives:
  - Describe practical applications of BCD and hexadecimal.
  - Explain how binary and hexadecimal representations support the storage and processing of data used
    by AI systems.
- title: Representation of signed integers
  kind: content
  term: 1
  week: 8
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 27
  objectives:
  - Describe methods used to represent signed integers, including sign magnitude, one’s complement, and
    two’s complement.
  - Represent and interpret signed integers using different binary representation methods.
- title: Signed Integer Arithmetic
  kind: content
  term: 1
  week: 8
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 28
  objectives:
  - Perform addition and subtraction of signed integers using sign- magnitude, one’s complement, and two’s
    complement representations.
  - Identify overflow and underflow conditions when performing signed integer arithmetic.
- title: Representation of characters, images and sound – Part 1
  kind: content
  term: 1
  week: 8
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 29
  objectives:
  - Explain different character encoding schemes (ASCII, EBCDIC, Unicode).
  - Describe basic principles of digitizing images (pixels, resolution, colour depth).
- title: Representation of characters, images and sound – Part 2
  kind: content
  term: 1
  week: 8
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 30
  objectives:
  - Describe basic principles of digitizing sound (sampling rate, bit depth).
  - Explain how character, image and sound data can be represented as digital inputs for AI applications.
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 9
  module: Computer Organisation and Architecture
  competency: Representing data in Computer Systems
  nature:
  - th
  lesson_no: 31
- title: Digital Logic and Logic Gates
  kind: content
  term: 1
  week: 9
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 32
  objectives:
  - Explain the role of digital logic circuits in computer systems.
  - Describe the functions and symbols of basic, universal, and exclusive logic gates.
  - Construct truth tables for different logic gates.
- title: Logic Circuit Design 1 – Part 1
  kind: content
  term: 1
  week: 9
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 33
  objectives:
  - Define combinational logic circuit.
  - Explain the relationship between logic gates, inputs, and outputs in digital circuits.
  - Design simple combinational circuits using logic gates.
- title: Logic Circuit Design 1 – Part 2
  kind: content
  term: 1
  week: 9
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 34
  objectives:
  - Analyse digital circuits by deriving outputs and constructing truth tables.
  - Explain how logic circuits provide the basic computational operations used by AI-enabled digital systems.
- title: Binary Arithmetic Circuits
  kind: content
  term: 1
  week: 10
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 35
  objectives:
  - Explain the operation of half-adder and full-adder circuits.
  - Design and analyse binary addition circuits using logic gates.
  - Explain the operation of half-subtractor and full-subtractor circuits.
- title: Sequential Logic Circuits
  kind: content
  term: 1
  week: 10
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 36
  objectives:
  - Define sequential logic circuit.
  - Explain the difference between combinational and sequential logic circuits.
  - Describe the purpose and operation of flip-flops in digital systems.
  - Derive truth tables and determine outputs of SR and JK flip- flops.
- title: Practical Digital Logic and Sequential Circuits
  kind: content
  term: 1
  week: 10
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 37
  objectives:
  - Construct logic circuits/truth tables, implement universal NAND/NOR logic, design simple circuits
    such as traffic lights, deduce inputs/outputs and identify application areas.
  - Produce truth tables for half/full adders; describe SR and JK flip-flops and their role as storage
    elements; derive flip-flop truth tables.
  - Perform Boolean algebra using De Morgan's laws.
  - Relate sequential logic and storage elements to the operation of hardware used in AI and intelligent
    systems.
- title: Integration Activity
  kind: integration_activity
  term: 1
  week: 10
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
  lesson_no: 38
- title: Evaluation
  kind: evaluation
  term: 1
  week: 11
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
- title: Remediation
  kind: remediation
  term: 1
  week: 11
  module: Computer Organisation and Architecture
  competency: Designing and Analysing Digital Logic Circuits
  nature:
  - th
- title: Introduction to Computer Organisation and Architecture – Part 1
  kind: content
  term: 1
  week: 11
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 39
  objectives:
  - Define computer organisation and computer architecture.
  - Differentiate between organisation and architecture.
  - Identify major computer system components.
- title: Introduction to Computer Organisation and Architecture – Part 2
  kind: content
  term: 1
  week: 11
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 40
  objectives:
  - Explain the roles of the CPU, memory and I/O devices.
  - Explain the stored-program concept.
  - Describe and illustrate the organisation of Von Neumann and Harvard architectures.
- title: Advanced Processor Architectures – Part 1
  kind: content
  term: 1
  week: 12
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 41
  objectives:
  - Outline differences between RISC and CISC architectures and the importance/use of pipelining and registers
    in RISC.
  - Compare Von Neumann with Flynn(SISD, SIMD, MISD, MIMD), CRAY, Dataflow and Harvard architectures.
  - Analise parallel processing techniques used to improve computational performance.
- title: Advanced Processor Architectures – Part 2
  kind: content
  term: 1
  week: 12
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 42
  objectives:
  - Outline roles of virtual machines and explain their benefits and limitations.
  - Compare the advantages and limitations of Von Neumann and Harvard architectures.
  - Explain why parallel processing and specialized processor architectures are important for AI workloads.
- title: System Communication and Timing
  kind: content
  term: 1
  week: 12
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 43
  objectives:
  - Explain the purpose of system buses in a computer system.
  - Describe the functions of the data bus, address bus, and control bus.
  - Illustrate how system buses enable communication between the CPU, memory, and I/O devices.
  - Explain how data are transferred between computer-system components.
  - Explain roles of the system clock and Immediate Access Store (IAS).
- title: The Processor, Its Components and the machine cycle
  kind: content
  term: 1
  week: 12
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 44
  objectives:
  - Explain the functions of the major components of the processor, including the Control Unit, ALU, and
    registers.
  - Describe fetch, decode and execute stages.
  - Trace instruction execution.
  - Identify registers used.
- title: Interrupts, Polling and Parallel Processing
  kind: content
  term: 2
  week: 13
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 45
  objectives:
  - Explain situations in which polling occurs and where interrupts occur; compare pipelining and parallel
    processing.
  - Describe interrupt-detection strategy.
  - Relate cycle efficiency to performance.
  - Explain how interrupts and parallel processing can improve the responsiveness and performance of AI-enabled
    systems.
- title: Assembly Instructions and Addressing Modes
  kind: content
  term: 2
  week: 13
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 46
  objectives:
  - Trace a simple assembly-language program and explain/manipulate instruction sets, including data movement,
    I/O, arithmetic, unconditional/conditional and compare instructions.
  - Give examples of instruction formats; explain fixed- versus variable-length instructions; and distinguish
    immediate, direct, indirect, register, relative and indexed addressing modes.
- title: Integration Activity
  kind: integration_activity
  term: 2
  week: 13
  module: Computer Organisation and Architecture
  competency: Exploring Computer Organisation and Architecture
  nature:
  - th
  lesson_no: 47
- title: Primary Storage – Part 1
  kind: content
  term: 2
  week: 13
  module: Computer Organisation and Architecture
  competency: Managing Computer Memory
  nature:
  - th
  lesson_no: 48
  objectives:
  - Explain the concept of memory hierarchy.
  - Evaluate the relationship between speed, capacity, and cost in memory organisation.
  - Explain the functions and characteristics of primary memory (RAM, ROM, Cache).
  - Differentiate between RAM and ROM types.
- title: Primary Storage – Part 2
  kind: content
  term: 2
  week: 14
  module: Computer Organisation and Architecture
  competency: Managing Computer Memory
  nature:
  - th
  lesson_no: 49
  objectives:
  - State applications of RAM, ROM and Cache.
  - Differentiate SRAM and DRAM.
  - Explain how memory capacity, speed and hierarchy affect the performance of AI applications and data
    processing.
- title: Memory Addressing Concepts
  kind: content
  term: 2
  week: 14
  module: Computer Organisation and Architecture
  competency: Managing Computer Memory
  nature:
  - th
  lesson_no: 50
  objectives:
  - Explain memory addressing concepts.
  - Perform memory capacity calculations.
  - Calculate the number of memory locations from address lines. Solve problems involving memory organisation.
- title: Secondary Storage Technologies
