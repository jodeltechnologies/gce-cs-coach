lessons:
- title: Diagnostic evaluation
  kind: diagnostic_evaluation
  term: 1
  week: 1
  module: Computing Systems and Components
  competency: History and Evolution of Computing
  nature:
  - th
- title: History and Evolution of Computing
  kind: content
  term: 1
  week: 1
  lesson_no: 1
  module: Computing Systems and Components
  competency: History and Evolution of Computing
  nature:
  - th
  objectives:
  - Identify the generations of computers and the main technology used in each period.
  - Compare characteristics such as size, processing capability and price across generations.
  - Differentiate between the Von Neumann and Harvard architecture.
  - Explain the stored program concept.
- title: Introduction to Artificial Intelligence (AI)
  kind: content
  term: 1
  week: 1
  lesson_no: 2
  module: Impacting society with digital technologies
  competency: Exploring AI Concepts
  nature:
  - th
  objectives:
  - Define AI and explain its history and evolution.
  - Identify and describe the main types of AI.
  - Explain common applications of AI.
- title: AI Ethics and Responsible Use
  kind: content
  term: 1
  week: 1
  lesson_no: 3
  module: Impacting society with digital technologies
  competency: Exploring AI Concepts
  nature:
  - th
  objectives:
  - Explain ethical issues associated with AI.
  - Examine the potential risks and benefits of AI.
  - Discuss principles for the responsible use of AI.
- title: AI Techniques and Intelligent Systems
  kind: content
  term: 1
  week: 1
  lesson_no: 4
  module: Impacting society with digital technologies
  competency: Exploring AI Concepts
  nature:
  - th
  objectives:
  - Describe common AI techniques and their applications.
  - Explain the characteristics of intelligent systems.
  - Compare AI techniques and intelligent systems based on their applications.
- title: Machine Learning
  kind: content
  term: 1
  week: 2
  lesson_no: 5
  module: Impacting society with digital technologies
  competency: Exploring AI Concepts
  nature:
  - th
  objectives:
  - Define Machine Learning.
  - Explain the basic principles of Machine Learning.
  - Distinguish between supervised, unsupervised and reinforcement learning.
- title: Developing AI Systems
  kind: content
  term: 1
  week: 2
  lesson_no: 6
  module: Impacting society with digital technologies
  competency: Exploring AI Concepts
  nature:
  - th
  objectives:
  - Explain the stages involved in developing an AI system.
  - Identify programming languages and tools used in AI development.
  - Explain why Python is widely used in AI development.
- title: Types of Computers
  kind: content
  term: 1
  week: 2
  lesson_no: 7
  module: Computing Systems and Components
  competency: Description of computing trends and categorization of computers
  nature:
  - th
  objectives:
  - Identify types of computers (supercomputer, mainframe, minicomputer, microcomputer).
  - Describe each type of computer with respect to size, power, cost and purpose.
  - Choose an appropriate computer type suited to a given situation.
- title: Basic Components of a Computer
  kind: content
  term: 1
  week: 2
  lesson_no: 8
  module: Computing Systems and Components
  competency: Description of computing trends and categorization of computers
  nature:
  - th
  objectives:
  - Explain the concepts of hardware, input, output, storage and processing device.
  - State the purpose of common devices in each category (input, output, storage, and processing).
  - Choose an appropriate device for a given situation.
- title: Input devices
  kind: content
  term: 1
  week: 3
  lesson_no: 9
  module: Computing Systems and Components
  competency: Description of computing trends and categorization of computers
  nature:
  - th
  objectives:
  - Explain the concept of automatic data capture.
  - >-
    Describe the following automatic data capture devices (MICR, OCR, OMR, barcode reader, QR code reader,
    card readers, RFID readers, Biometric readers).
  - >-
    Explain how AI-based image recognition extends automatic data capture beyond QR/barcode reading.
- title: Output devices
  kind: content
  term: 1
  week: 3
  lesson_no: 10
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - >-
    Differentiate between the different types of printers (dot matrix printer, laser printer, inkjet printer).
  - Describe the following output devices (projector, graph plotter, 3D printers, actuators).
  - Justify choice of an output device in a given situation.
- title: Secondary Storage media and devices
  kind: content
  term: 1
  week: 3
  lesson_no: 11
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - Differentiate between secondary storage and primary storage.
  - >-
    Describe the different types of secondary storage media and devices (Magnetic storage, Optical storage,
    and Solid-state drives).
  - Justify choice of a storage media and device in a given situation.
- title: Primary Storage devices
  kind: content
  term: 1
  week: 3
  lesson_no: 12
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - Describe types of primary storage (RAM, ROM, cache, registers).
  - Compare memory types based on access speed, cost and storage capacity.
  - >-
    Explain why large-scale AI/machine-learning training requires significant secondary storage capacity
    for its datasets.
- title: Processing device and the machine instruction cycle
  kind: content
  term: 1
  week: 4
  lesson_no: 13
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - Differentiate between CPU and GPU.
  - Describe the different stages of the machine instruction cycle.
  - >-
    Explain why AI/machine-learning workloads rely heavily on parallel GPU processing rather than the
    CPU alone.
- title: Processor architectures, parallel & distributed computing
  kind: content
  term: 1
  week: 4
  lesson_no: 14
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - Explain processor architectures (CISC and RISC).
  - Describe Flynn's architectures (SIMD, SISD, MISD, MIMD).
  - Differentiate between parallel and distributed computing.
- title: Conversion between units of storage and units of processing
  kind: content
  term: 1
  week: 4
  lesson_no: 15
  module: Computing Systems and Components
  competency: Hardware and Categorisation of Hardware components
  nature:
  - th
  objectives:
  - Identify units of storage and units of processing.
  - >-
    State the relationships between storage units (bits, bytes, terabytes,...) and processing units (Hertz,
    Kilohertz, Gigahertz).
  - Convert from one unit of storage to another.
- title: Definitions and classification of software
  kind: content
  term: 1
  week: 4
  lesson_no: 16
  module: Computing Systems and Components
  competency: Computer Software
  nature:
  - th
  objectives:
  - Explain the concept of software.
  - Explain the difference between system software and application software.
  - Establish with examples the difference between open source and proprietary software.
- title: Application software
  kind: content
  term: 1
  week: 5
  lesson_no: 17
  module: Computing Systems and Components
  competency: Computer Software
  nature:
  - th
  objectives:
  - Differentiate between general purpose, specific purpose and tailor-made software.
  - >-
    Describe common types of application software (word processor, browser, spreadsheet, desktop publishing,,
    graphic, Presentation, artificial intelligence, etc).
  - Choose appropriate application software for a given task or situation.
- title: Evaluation No 1
  kind: evaluation
  term: 1
  week: 5
  module: Computing Systems and Components
  competency: Computer Software
  nature:
  - th
- title: Remediation No 1
  kind: remediation
  term: 1
  week: 5
  module: Computing Systems and Components
  competency: Computer Software
  nature:
  - th
  objectives:
  - Review and correct the common errors identified in Evaluation No 1.
  - >-
    Reinforce weak areas in computing history, AI concepts and hardware categorisation through guided
    practice.
  - >-
    Support learners who under-performed before moving into computer software and operating systems.
- title: System software and examples
  kind: content
  term: 1
  week: 5
  lesson_no: 18
  module: Computing Systems and Components
  competency: Computer Software
  nature:
  - th
  objectives:
  - >-
    Describe the different types of system software (operating system, device drivers, utility software).
  - >-
    Describe common types of utility software (antivirus, disk cleaner, defragmenter, File management,
    File compression, etc).
  - >-
    Identify examples of AI-powered utility software, such as intelligent antivirus and predictive disk
    optimisation.
- title: Notions of the Operating System
  kind: content
  term: 1
  week: 6
  lesson_no: 19
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - Outline major landmarks in the history and evolution of operating systems.
  - >-
    Describe types of operating systems (single user, batch, online, multi-user, NOS, multitasking, real-time).
  - State functions of an operating system.
- title: Functions of an operating system 1
  kind: content
  term: 1
  week: 6
  lesson_no: 20
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - Distinguish between pre-emptive and non-pre-emptive scheduling.
  - Describe scheduling algorithms (FCFS, SJF, SRT, round robin).
  - >-
    Explain briefly how AI techniques are used in modern operating systems for predictive process scheduling.
- title: Functions of the operating system 2
  kind: content
  term: 1
  week: 6
  lesson_no: 21
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - Explain how the operating system manages memory, files, Devices (Input & output).
  - >-
    Explain the following concepts as used in operating systems: deallocation, virtual memory, buffering,
    spooling, metadata.
- title: Installing an operating system and user interfaces
  kind: content
  term: 1
  week: 6
  lesson_no: 22
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - Install an operating system (Windows or Linux).
  - Identify OS interfaces (GUI, CLI) and their strengths and weaknesses.
  - Select appropriate interface for a given context.
- title: Using the GUI of an operating system
  kind: content
  term: 1
  week: 7
  lesson_no: 23
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - 'Explain the following concepts: file, folder, file format.'
  - >-
    Perform operations (creation, renaming, deleting, copying, cutting, compressing, …) on files and folders
    using the GUI of an operating system.
  - Set up an OS to avoid unauthorised access using a GUI.
- title: Using the CLI of an operating system
  kind: content
  term: 1
  week: 7
  lesson_no: 24
  module: Computing Systems and Components
  competency: Operating Systems
  nature:
  - th
  objectives:
  - Launch and identify command line environments (MS-DOS or Linux).
  - Perform operations on files and folders using the CLI.
  - Write and execute a command-line script to automate a task.
- title: Hardware faults identification and correction
  kind: content
  term: 1
  week: 7
  lesson_no: 25
  module: Computing Systems and Components
  competency: Hardware and Software Maintenance
  nature:
  - th
  objectives:
  - >-
    Explain the following concepts computer maintenance, preventive maintenance, corrective maintenance.
  - Describe common hardware faults in a computer system and techniques to curb them.
- title: Software faults identification and correction
  kind: content
  term: 1
  week: 7
  lesson_no: 26
  module: Computing Systems and Components
  competency: Hardware and Software Maintenance
  nature:
  - th
  objectives:
  - Differentiate between hardware and software maintenance.
  - Describe common software faults and how to curb them.
- title: Assistive technology
  kind: content
  term: 1
  week: 8
  lesson_no: 27
  module: Computing Systems and Components
  competency: Assistive technologies and computer ergonomics
  nature:
  - th
  objectives:
  - Explain the concept of assistive technology.
  - >-
    Describe assistive technologies (Braille keyboard, audio devices, automatic speech recognition).
  - >-
    Explain how AI-based speech recognition and predictive text have improved assistive technology for
    learners with disabilities.
- title: Computer ergonomics
  kind: content
  term: 1
  week: 8
  lesson_no: 28
  module: Computing Systems and Components
  competency: Assistive technologies and computer ergonomics
  nature:
  - th
  objectives:
  - Explain the concept of computer ergonomics.
  - >-
    Explain computer-related health hazards and their causes. (musculoskeletal disorders, eye strain).
  - >-
    Describe correct posture, habits, and equipment positioning to avoid computer related health hazards.
- title: Editing and Formatting text
  kind: content
  term: 1
  week: 8
  lesson_no: 29
  module: Computing Systems and Components
  competency: Using a word processor
  nature:
  - th
  objectives:
  - Perform text formatting with a word processor.
  - Perform text editing with a word processor.
  - >-
    Identify how AI-based writing assistants support grammar, style and content suggestions during text
    editing.
- title: Editing and formatting images and tables
  kind: content
  term: 1
  week: 8
  lesson_no: 30
  module: Computing Systems and Components
  competency: Using a word processor
  nature:
  - th
  objectives:
  - Perform editing and formatting of images and graphics.
  - Perform editing and formatting of tables.
- title: Using Text boxes and adjusting Page layout
  kind: content
  term: 1
  week: 9
  lesson_no: 31
  module: Computing Systems and Components
  competency: Using a word processor
  nature:
  - th
  objectives:
  - Perform editing and formatting of text boxes.
  - Modify features of a page (margins, orientation, size, columns, …).
  - Add comments to sections of a document.
- title: Integration Activity No 1
  kind: integration_activity
  term: 1
  week: 9
  module: Practical Problem solving in the digital world
  nature:
  - th
  objectives:
  - >-
    Given a computer system to be made operational for a stated user, including one requiring assistive
    technology, select and justify appropriate system and application software.
  - >-
    Install/configure the operating system and required software, applying correct ergonomic setup and
    safe working practices.
  - Demonstrate at least one accessibility feature suited to the stated user's needs.
- title: Introduction to spreadsheets
  kind: content
  term: 1
  week: 9
  lesson_no: 32
  module: Practical Problem solving in the digital world
  competency: Using electronic spreadsheets
  nature:
  - th
  objectives:
  - >-
    Describe the following spreadsheet components: row, column, row number, column number, cell, cell
    address, range, formula, sheet.
  - Select a row, column, cell, range, and non-contiguous cells on an electronic spreadsheet.
  - Perform basic editing and formatting using a spreadsheet.
- title: Performing calculations using spreadsheets
  kind: content
  term: 1
  week: 9
  lesson_no: 33
  module: Practical Problem solving in the digital world
  competency: Using electronic spreadsheets
  nature:
  - th
  objectives:
  - Perform basic arithmetic operations using an electronic spreadsheet (without using functions).
  - Perform calculations using the SUM, AVERAGE, COUNT, PRODUCT, IF function, COUNTIF.
  - >-
    Explain how AI-powered spreadsheet functions can automatically detect data trends and generate forecasts.
- title: Types of cells referencing and calculations
  kind: content
  term: 1
  week: 10
  lesson_no: 34
  module: Practical Problem solving in the digital world
  competency: Using electronic spreadsheets
  nature:
  - th
  objectives:
  - Differentiate between the different types of cells referencing.
  - >-
    Solve data problems using appropriate spreadsheet functions (SUM, AVERAGE, COUNT, PRODUCT, IF function,
    COUNTIF, RANK) and cell reference.
- title: Evaluation No 2
  kind: evaluation
  term: 1
  week: 10
  module: Practical Problem solving in the digital world
  competency: Using electronic spreadsheets
  nature:
  - th
- title: Remediation No 2
  kind: remediation
  term: 1
  week: 10
  module: Practical Problem solving in the digital world
  competency: Using electronic spreadsheets
  nature:
  - th
  objectives:
  - Review and correct the common errors identified in Evaluation No 2.
  - >-
    Reinforce weak areas in software, operating systems and productivity tools (word processor, spreadsheet)
    through guided practice.
  - Support learners who under-performed before continuing with the next block.
- title: Positive and Negative Uses of Computer Systems
  kind: content
  term: 1
  week: 10
  lesson_no: 35
  module: Practical Problem solving in the digital world
  competency: Digital Citizenship and Ethics
  nature:
  - th
  objectives:
  - State positive and negative uses of computer systems.
  - Explain the social and economic effects of computer systems.
  - Explain how ICT can be responsibly used to influence communication and culture.
- title: Computer Ethics, Legislation and Cameroon Law
  kind: content
  term: 1
  week: 11
  lesson_no: 36
  module: Practical Problem solving in the digital world
  competency: Digital Citizenship and Ethics
  nature:
  - th
  objectives:
  - Explain the code of ethics and moral obligation of computer users.
  - Explain unethical acts with focus on those punishable by Cameroon law.
  - Discuss ethical concerns raised by AI-generated content, deepfakes and algorithmic bias.
- title: Data Protection, Copyright and the Digital Divide
  kind: content
  term: 1
  week: 11
  lesson_no: 37
  module: Practical Problem solving in the digital world
  competency: Digital Citizenship and Ethics
  nature:
  - th
  objectives:
  - Demonstrate knowledge of current data protection and copyright acts.
  - Determine the effects of global communication on citizenship, culture and digital divide.
  - Suggest practical ways of reducing the digital divide in the community.
- title: Protecting Computer Systems from Illegal Access
  kind: content
  term: 1
  week: 11
  lesson_no: 38
  module: Practical Problem solving in the digital world
  competency: Cybersecurity
  nature:
  - th
  objectives:
  - Explain the security, reliability and resilience of computer systems.
  - >-
    Describe measures used to protect systems from illegal access (passwords, security codes, encryption,
    biometrics, physical security).
  - Explain the necessity of data handling and backup.
- title: System Recovery and Safe Working Practices
  kind: content
  term: 1
  week: 11
  lesson_no: 39
  module: Practical Problem solving in the digital world
  competency: Cybersecurity
  nature:
  - th
  objectives:
  - State the importance of recovery in the event of system failure.
  - Explain the importance of privacy and safe working practices.
  - Illustrate with examples how safe working practices protect a computer system.
- title: Computer Crimes and Combat Measures
  kind: content
  term: 1
  week: 12
  lesson_no: 40
  module: Practical Problem solving in the digital world
  competency: Cybersecurity
  nature:
  - th
  objectives:
  - >-
    Describe data handling and computer-related crime (copyright infringement, plagiarism, computer-assisted
    crime).
  - Classify computer crimes into computer-related and computer- assisted crimes.
  - Associate types of computer crimes to specific measures used to combat them.
- title: Malware — Types and Characteristics
  kind: content
  term: 1
  week: 12
  lesson_no: 41
  module: Practical Problem solving in the digital world
  competency: Cybersecurity
  nature:
  - th
  objectives:
  - Describe different types of malware (virus, worm, Trojan horse, rootkit, backdoor, spyware).
  - Compare the different types of malware based on how they spread and their effects.
  - >-
    Explain how AI is used both to detect malware through behavioural analysis and to create more sophisticated,
    AI- generated attacks.
- title: Protecting a Computer System from Malware
  kind: content
  term: 1
  week: 12
  lesson_no: 42
  module: Practical Problem solving in the digital world
  competency: Cybersecurity
  nature:
  - th
  objectives:
  - >-
    Explain good practices (opening trusted attachments, scanning email, downloading from trusted websites)
    to protect against malware.
  - Scan a computer system using an antivirus.
  - Set up protection against unauthorised access using a firewall.
- title: Integration Activity No 2
  kind: integration_activity
  term: 1
  week: 12
  module: Practical Problem solving in the digital world
  nature:
  - th
  objectives:
  - >-
    Produce a properly formatted document and an accompanying spreadsheet performing at least one calculation,
    both relevant to a stated real-life task.
  - >-
    Identify the ethical, legal and data-protection obligations that apply to handling the data used in
    the task.
  - >-
    Apply at least two practical measures to protect the data/system used from unauthorised access or
    malware.
- title: Types of Systems
  kind: content
  term: 2
  week: 13
  lesson_no: 43
  module: Practical Problem solving in the digital world
  competency: Description of Systems
  nature:
  - th
  objectives:
  - Describe a system and distinguish between natural and artificial systems.
  - Differentiate between manual and automatic systems (e.g. email, e-learning).
  - Categorise systems in the learner's environment (manual, automatic).
- title: Modelling a System with a Data Flow Diagram
  kind: content
  term: 2
  week: 13
  lesson_no: 44
  module: Practical Problem solving in the digital world
  competency: Description of Systems
  nature:
  - th
  objectives:
  - Propose limitations on an identified manual system.
  - Produce a data flow diagram for a given system.
  - >-
    Identify an AI-driven system as an example of an automatic system that can be modelled with a data
    flow diagram.
- title: Introduction to Information Systems
  kind: content
  term: 2
  week: 13
  lesson_no: 45
  module: Practical Problem solving in the digital world
  competency: Information Systems and Data processing
  nature:
  - th
  objectives:
  - Define an information system.
  - >-
    state the components of an information system and their role (people, procedure, technology, data).
  - Describe the hierarchical structure of an organisation.
  - Identify factors affecting the success or failure of an information system.
  - Establish the necessity for information systems in a library, hospital, company or school.
- title: Types of Information Systems
  kind: content
  term: 2
