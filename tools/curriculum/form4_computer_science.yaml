    competency: Optimising computer performance
    term: 2
    week: 13
    objectives:
      - Outline common software for optimising the performance of a computer
      - "Explain the following concepts and how they affect the performance of a computer: malware, fragmentation, defragmentation"
      - Explain how antivirus, disk defragmenter, disk cleaner, and operating system configurations can improve the performance of a computer
  - lesson_no: 31
    title: Hardware methods for optimising the computer
    competency: Optimising computer performance
    term: 2
    week: 13
    objectives:
      - Explain how size of RAM and disk can improve computer performance
      - Explain how SSDs improve computer performance compared to HDDs
