  - {lesson_no: 29, title: Integration activities, kind: integration_activity, competency: Analysing simple logic circuits, term: 1, week: 12}
  - {title: Remediation, kind: remediation, term: 1, week: 12}
  - {title: Remediation, kind: remediation, term: 1, week: 12}

  - lesson_no: 30
