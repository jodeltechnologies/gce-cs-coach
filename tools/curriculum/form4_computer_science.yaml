  - {lesson_no: 38, title: Integration activities, kind: integration_activity, competency: Calculating storage space, term: 2, week: 15}

  - lesson_no: 39
    title: Notions on computer maintenance
    competency: Carrying out basic computer maintenance
    term: 2
    week: 16
    objectives:
