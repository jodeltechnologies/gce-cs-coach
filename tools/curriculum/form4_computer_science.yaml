  - lesson_no: 21
    title: Conversion from any base to base 10
    competency: Operations on number systems
    term: 1
    week: 9
    objectives:
      - Explain the principle of conversion from any base to base 10
      - Convert from base 2, 8, and 16 to base 10
  - lesson_no: 22
    title: Conversion from base 10 to any base
    competency: Operations on number systems
    term: 1
    week: 9
    objectives:
      - Explain the principle of conversion from base 10 to any base
      - Convert from base 10 to base 2, 8, and 16
  - lesson_no: 23
    title: Conversion from base 2 to 8 and 16 and vice versa
    competency: Operations on number systems
    term: 1
    week: 9
    objectives:
      - Explain the principle of conversion from base 2 directly to base 8, and 16
      - Explain the principle of conversion from base 8 or 16 directly to base 2
      - Convert from base 2 to 8, and 16 and from base 8, and 16 to base 2
  - lesson_no: 24
    title: Addition and subtraction in a number system
    competency: Operations on number systems
    term: 1
    week: 10
    objectives:
      - Explain the principle of addition in any number system
      - Explain the principle of subtraction in any number system
      - Apply the principle of addition and subtraction to add and subtract in a base 2, 8, and 16
  - {lesson_no: 25, title: Integration activities, kind: integration_activity, competency: Operations on number systems, term: 1, week: 10}

  - lesson_no: 26
    title: Basic logic gates
    competency: Analysing simple logic circuits
    term: 1
    week: 10
    objectives:
      - Explain the concept of logic gates and truth tables
      - Identify a given basic logic gate
      - Explain the functioning of a given basic logic gate
      - Produce the truth table of a given basic logic gate
  - {title: Evaluation, kind: evaluation, term: 1, week: 11}
  - lesson_no: 27
    title: Derived gates
    competency: Analysing simple logic circuits
