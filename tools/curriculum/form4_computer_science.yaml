syllabus:
  title: Annual Harmonised Progression Sheet for Computer Science Form 4
  subject: Computer Science
  level: GCE Ordinary Level
  level_short: O/L
  form_level: Form 4
  issuing_authority: Inspectorate General of Education, Inspectorate of Pedagogy in charge of the Teaching of Computer Science
  scope: national
  version_label: Harmonised Progression (current)
  effective_from: 2025
  total_weeks: 36
  weekly_periods_theory: 3
  coefficient: 3
  has_modules: true
  uses_competencies: true
  has_competency_statements: true
  has_practical_stream: false

modules:
  - {sequence: 1, title: Problem solving and coding 2}
  - {sequence: 2, title: Data manipulation 1}
  - {sequence: 3, title: Hardware and software systems 2}
  - {sequence: 4, title: "Ethics, society and legal issues 2"}

competencies:
  - sequence: 1
    category: Using control structures
    module: Problem solving and coding 2
    statement: >-
      Given an algorithmic problem that requires the use of control structures,
      learners produce algorithms that use the appropriate control structure to
      solve the problem.
  - sequence: 2
    category: Testing and debugging
    module: Problem solving and coding 2
    statement: >-
      Given an algorithm, learners evaluate its semantic correctness using the
      dry-run technique and propose a way of fixing errors if any.
  - sequence: 3
    category: Setting up a programming environment
    module: Problem solving and coding 2
    statement: >-
      Given a problem, learners select the appropriate tools for programming and
      install them.
  - sequence: 4
    category: Writing of source code
    module: Problem solving and coding 2
    statement: >-
      Given an algorithm, learners transform it into a syntactically and
      semantically correct program.
  - sequence: 5
    category: Operations on number systems
    module: Data manipulation 1
    statement: >-
      Presented with a situation that involves number systems, learners apply
      appropriate operations on number systems to solve the problem.
  - sequence: 6
    category: Analysing simple logic circuits
    module: Data manipulation 1
    statement: >-
      Learners analyse a situation concerning logic circuits and determine the
      correct outputs and truth tables of the different elements used in the
      circuit.
  - sequence: 7
    category: Optimising computer performance
    module: Hardware and software systems 2
    statement: >-
      Provided with a situation with issues related to optimising a computer,
      learners propose methods of optimising the computer which are coherent
      with the situation.
  - sequence: 8
    category: Choosing appropriate peripheral devices
    module: Hardware and software systems 2
    statement: >-
      Learners select appropriate peripheral devices based on a situation or
      context. Clear justification of the choice should be made.
  - sequence: 9
    category: Calculating storage space
    module: Hardware and software systems 2
    statement: >-
      Given a problem with factors related to storage space and units, learners
      determine the cause and solution to the problem showing clearly how they
      achieved the proposed conclusions.
  - sequence: 10
    category: Carrying out basic computer maintenance
    module: Hardware and software systems 2
    statement: >-
      When presented with a situation involving issues with a computer, learners
      propose possible causes and possible methods to fix such issues.
  - sequence: 11
    category: Creating digital content
    module: Hardware and software systems 2
    statement: >-
      Faced with a situation related to the creation and editing of digital
      content, learners propose a variety of tools that can be used to solve the
      problem and produce digital content using an appropriate tool.
  - sequence: 12
    category: Producing word processed documents
    module: Hardware and software systems 2
    statement: >-
      Given a task that is related to using a word processor to produce or
      reproduce content, learners use appropriate features of a word processor
      to achieve the task.
  - sequence: 13
    category: Manipulating spreadsheets
    module: Hardware and software systems 2
    statement: >-
      Given tasks that is related to spreadsheets and with appropriate guidance,
      learners choose functions or spreadsheet features that are coherent with
      the tasks and apply them correctly on spreadsheet software.
  - sequence: 14
    category: Understanding embedded system IoT and Cloud Computing
    module: Hardware and software systems 2
    statement: >-
      Given a situation with factors related to IoT and embedded systems,
      learners identify the correct type of sensors used in the situation and
      their role.
  - sequence: 15
    category: Practising netiquette rules
    module: Ethics, society and legal issues 2
    statement: >-
      Placed in a context that requires communicating with others, learners
      determine and apply appropriate behavioural norms that respect others and
      their cultural and generational diversities.
  - sequence: 16
    category: Appraising National and International Laws on Cybersecurity
    module: Ethics, society and legal issues 2
    statement: >-
      Learners state national and international laws or acts that are related to
      protecting and regulating activities in the cyberspace.
  - sequence: 17
    category: Evaluating the credibility and reliability of information
    module: Ethics, society and legal issues 2
    statement: >-
      Given a problem with factors related to the reliability and credibility of
      information, learners propose strategies of verifying the information. The
      strategies proposed should be pertinent, coherent, and logical.
  - sequence: 18
    category: Avoiding computer related health issues
    module: Ethics, society and legal issues 2
    statement: >-
      Given a problem or a situation related to avoiding computer related issues,
      learners evaluate the workplace, practices and habits of users based on
      standards and report on elements to reinforce and elements to adjust. The
      recommendations should express appropriate practices and health issues that
      can arise for not respecting these practices.

lessons:
  - {title: Diagnostic evaluation, kind: diagnostic_evaluation, term: 1, week: 1}

  - lesson_no: 1
    title: Sequence and selection control structure
    competency: Using control structures
    term: 1
    week: 1
    objectives:
      - Explain how sequence and selection control structures work
      - Illustrate the functioning of sequence and selection control structures with a flowchart
      - Write simple algorithms that make use of a selection control structure
  - lesson_no: 2
    title: Multiple selection constructs
    competency: Using control structures
    term: 1
    week: 1
    objectives:
      - Explain how the different types of multiple selection constructs work
      - Illustrate the functioning of the different multiple selection constructs
      - Write algorithms that make use of multiple selection control structures
  - lesson_no: 3
    title: Iterative constructs
    competency: Using control structures
    term: 1
    week: 2
    objectives:
      - Identify situations where an iterative or loop control structure is needed
      - Describe the 4 main parts of a loop
      - Explain advantages and disadvantages of iterative control structures
  - lesson_no: 4
    title: Definite iterative constructs
    competency: Using control structures
    term: 1
    week: 2
    objectives:
      - Choose correctly when to use a definite iteration
      - Build definite iterations that are coherent with a given context
      - Write simple algorithms that make use of definite iteration
  - lesson_no: 5
    title: Indefinite iterative constructs
    competency: Using control structures
    term: 1
    week: 2
    objectives:
      - Differentiate between pretest and posttest indefinite iterations
      - Illustrate the functioning of indefinite iterations using a flowchart
      - Write simple algorithms that make use of indefinite iteration
  - {lesson_no: 6, title: Integration activities, kind: integration_activity, competency: Using control structures, term: 1, week: 3}

  - lesson_no: 7
    title: Notions on testing and debugging
    competency: Testing and debugging
    term: 1
    week: 3
    objectives:
      - Explain the concepts of testing, test case, test data and bug
      - Differentiate between testing and debugging
      - Differentiate between black box test and white box test
  - lesson_no: 8
    title: Dry running
    competency: Testing and debugging
    term: 1
    week: 3
    objectives:
      - Explain the concepts of dry running and trace tables
      - Perform a dry run test on an algorithm
  - {lesson_no: 9, title: Integration activities, kind: integration_activity, competency: Testing and debugging, term: 1, week: 4}

  - lesson_no: 10
    title: Programming tools
    competency: Setting up a programming environment
    term: 1
    week: 4
    objectives:
      - "State the role of the following programming tools: text editor, translator, and IDE"
      - Differentiate between a compiler and an interpreter
      - Explain the advantages and disadvantages of installing an IDE over separate programming tools and vice-versa
  - lesson_no: 11
    title: Installation of programming tools
    competency: Setting up a programming environment
    term: 1
    week: 4
    nature: [th, prac, dig]
    objectives:
      - Install an IDE and use it to run a program
      - Test the functionalities of an installed programming tool
  - {lesson_no: 12, title: Integration activities, kind: integration_activity, competency: Setting up a programming environment, term: 1, week: 5}

  - {title: Evaluation, kind: evaluation, term: 1, week: 5}
  - lesson_no: 13
    title: Introduction to coding
    competency: Writing of source code
    term: 1
    week: 5
    objectives:
      - Explain the concept of coding
      - Explain strategies that can be used to ease coding
      - Identify the structure of a program in a given programming language
  - lesson_no: 14
    title: Coding 1
    competency: Writing of source code
    term: 1
    week: 6
    nature: [th, prac, dig]
    objectives:
      - Write source code that makes use of input, output, mathematical and assignment operators
  - {title: Remediation, kind: remediation, term: 1, week: 6}
  - {title: Remediation, kind: remediation, term: 1, week: 6}
  - lesson_no: 15
    title: Coding 2
    competency: Writing of source code
    term: 1
    week: 7
    nature: [th, prac, dig]
    objectives:
      - Write source code that makes use of selection control structures
  - lesson_no: 16
    title: Coding 3
    competency: Writing of source code
    term: 1
    week: 7
    nature: [th, prac, dig]
    objectives:
      - Write source code that make use of multiple selection control structures
  - lesson_no: 17
    title: Coding 4
    competency: Writing of source code
    term: 1
    week: 7
    nature: [th, prac, dig]
    objectives:
      - Write source code that make use of definite iterative control structures
  - lesson_no: 18
    title: Coding 5
    competency: Writing of source code
    term: 1
    week: 8
    nature: [th, prac, dig]
    objectives:
      - Write source code that make use of indefinite iterative control structures
  - {lesson_no: 19, title: Integration activities, kind: integration_activity, competency: Writing of source code, term: 1, week: 8}

  - lesson_no: 20
    title: Notions on number systems
    competency: Operations on number systems
    term: 1
    week: 8
    objectives:
      - Outline symbols of base 2, 8, 10, and 16
      - Identify symbols in a given base
