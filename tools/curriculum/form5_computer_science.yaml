      - State the properties of a database in 1NF, 2NF, and 3NF
      - Identify attributes, tables, primary key, foreign key, and relationships in a given situation
  - lesson_no: 78
    title: Use an RDBMS to create tables
    competency: Designing and implementing simple databases
    term: 3
    week: 33
    nature: [th, prac, dig]
    objectives:
      - Outline examples of an RDBMS
      - Identify common features of a given GUI RDBMS
      - Make use of a GUI RDBMS to create tables
  - lesson_no: 79
    title: Use an RDBMS to create relationships
    competency: Designing and implementing simple databases
    term: 3
    week: 33
    nature: [th, prac, dig]
    objectives:
      - Make use of a GUI RDBMS to create relationships
      - Enter data in a table found in a GUI RDBMS
      - Perform simple operations such as sorting and filtering data with the aid of a GUI RDBMS
  - lesson_no: 80
    title: Use an RDBMS to create queries and reports
    competency: Designing and implementing simple databases
    term: 3
    week: 33
    nature: [th, prac, dig]
    objectives:
      - Explain the concepts of database queries and reports
      - Make use of a GUI RDBMS to create queries that is coherent to a situation
      - Make use of a GUI RDBMS to create reports
  - {lesson_no: 81, title: Integration activities, kind: integration_activity, competency: Designing and implementing simple databases, term: 3, week: 33}

  - lesson_no: 82
    title: "Stages of SDLC: investigation, analysis, design"
    competency: Developing a system
    term: 3
    week: 34
    objectives:
      - Describe the investigation, analysis and design stages of the SDLC
      - Outline the functions of a system to be developed
      - Explain the concept of prototyping
      - Explain the need for appropriate choice of hardware and software for a system
  - lesson_no: 83
    title: "Stages of SDLC: development, testing, implementation, maintenance"
    competency: Developing a system
    term: 3
    week: 34
    objectives:
      - Describe the development, testing, implementation, and maintenance stages of the SDLC
      - Explain the need for documentation in system development
  - lesson_no: 84
    title: Implementation strategies
    competency: Developing a system
    term: 3
    week: 34
    objectives:
      - Describe the different implementation strategies
      - Outline the advantages and disadvantages of a given implementation strategy
  - {lesson_no: 85, title: Integration activities, kind: integration_activity, competency: Developing a system, term: 3, week: 34}

  - lesson_no: 86
    title: Introduction to project management
    competency: Managing projects
    term: 3
    week: 35
    objectives:
      - Explain the concept of project
      - Explain the need for project management
      - Describe the phases of the project life cycle
  - lesson_no: 87
    title: Project management tools
    competency: Managing projects
    term: 3
    week: 35
    objectives:
      - Describe tools used to plan, monitor and control a project
      - Produce the Gantt chart for a project
  - lesson_no: 88
    title: Project management concepts and metrics 1
    competency: Managing projects
    term: 3
    week: 35
    objectives:
      - Explain the concept of task, milestone, critical path, slack time, duration of project, critical tasks
      - Determine the critical path, slack time, and duration of a project from a Gantt chart
  - lesson_no: 89
    title: Project management concepts and metrics 2
    competency: Managing projects
    term: 3
