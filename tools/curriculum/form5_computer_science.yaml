syllabus:
  title: National Harmonised Progression Sheet for Computer Science Form 5
  subject: Computer Science
  level: GCE Ordinary Level
  level_short: O/L
  form_level: Form 5
  issuing_authority: >-
    Inspectorate General of Education, Inspectorate of Pedagogy in charge of the Teaching of Computer
    Science
  scope: national
  region: null
  version_label: National Harmonised Progression 2026/2027
  effective_from: 2026
  total_weeks: 36
  weekly_periods_theory: 3
  weekly_periods_practical: null
  coefficient: null
  module_label: Module
  has_modules: true
  uses_competencies: true
  has_competency_statements: true
  has_practical_stream: false
modules:
- title: Network Systems 2
  sequence: 1
- title: Hardware and Software Systems 3
  sequence: 2
- title: Problem Solving and Coding 3
  sequence: 3
- title: Data Manipulation
  sequence: 4
- title: System Security
  sequence: 5
- title: Data Manipulation 2
  sequence: 6
- title: Ethics, Society and Legal Issues 3
  sequence: 7
competencies:
- sequence: 1
  category: Social networks
  statement: >-
    Given the need to share experiences and knowledge, learners communicate using platforms that permit
    interaction in real-time.
  module: Network Systems 2
- sequence: 2
  category: Exploring Application Areas of Computers
  statement: >-
    Provided with a situation related to the use of AI, learners write appropriate prompts to get an output
    or response.
  module: Hardware and Software Systems 3
- sequence: 3
  category: Evaluating an information system
  statement: >-
    Given the description of an information system learners evaluate its effectiveness, efficiency, security,
    ease of use and reliability justifying their answer in each case.
  module: Problem Solving and Coding 3
- sequence: 4
  category: Developing a system
  statement: >-
    In a situation of developing a system for a school, business, party management, etc., learners select
    and design appropriate ways of organising data, describe the processing of data, and select appropriate
    hardware and software for the given task.
  module: Problem Solving and Coding 3
- sequence: 5
  category: Designing and implementing simple databases
  statement: >-
    Provided with a problem in an organisation related to databases, learners build simple database systems
    for the organisations. The implementation should meet the needs of the organisation.
  module: Problem Solving and Coding 3
- sequence: 6
  category: Managing projects
  statement: In a situation where a number of activities (tasks) are given
  module: Problem Solving and Coding 3
- sequence: 7
  category: Describing data structure
  statement: >-
    After analysing a problem such that the variables in a problem are known, learners choose the appropriate
    data type for each variable and determine the best data structure to use to guarantee efficient processing.
  module: Problem Solving and Coding 3
- sequence: 8
  category: Writing algorithms
  statement: >-
    Presented with a problem, learners express the solution by writing down instructions that will lead
    to solving the problem efficiently.
  module: Problem Solving and Coding 3
- sequence: 9
  category: Converting an algorithm into a program
  statement: >-
    In a situation where the algorithm for a problem is available, learners develop corresponding instructions
    in a programming language; using the appropriate IDE.
  module: Problem Solving and Coding 3
- sequence: 10
  category: Representing data in the computer
  statement: >-
    In a situation where data is stored in the computer, learners identify and use coding schemes to represent
    data
  module: Data Manipulation
- sequence: 11
  category: Describing peripheral devices
  statement: >-
    In a situation where a computer is to be equipped for various purposes, learners identify appropriate
    input and output peripheral devices for high productivity.
  module: Hardware and Software Systems 3
- sequence: 12
  category: Creating digital content using a software
  statement: >-
    Given tasks to accomplish, learners use appropriate features of a software to correctly accomplish
    the task.
  module: Hardware and Software Systems 3
- sequence: 13
  category: Proposing assistive technology for social inclusion
  statement: >-
    Given a situation with factors related to the aging and users with disabilities, learners select appropriate
    technologies for a given disability while clearly justifying their choices.
  module: Hardware and Software Systems 3
- sequence: 14
  category: Exploring the concepts related to data communication
  statement: >-
    Given a situation with factors related to data communication systems, learners explain correctly,
    concisely, and precisely the mechanisms used in the situation.
  module: Network Systems 2
- sequence: 15
  category: Setting up LANs
  statement: >-
    Given a situation that requires setting up a simple network, learners prescribe the appropriate tools
    and configuration to meet the needs of the situation.
  module: Network Systems 2
- sequence: 16
  category: Securing data, computers, and networks
  statement: >-
    Given a computing environment where computers, data and networks are exposed to security threats,
    learners identify potential risks and implement appropriate measures to protect data, computers and
    networks, justifying the security measures selected.
  module: System Security
- sequence: 17
  category: Evaluating the impacts of digital identities and digital footprints
  statement: >-
    Given a situation outlining the online practices of a user, learners evaluate their management of
    digital footprints, expose the risk they are facing and recommend tips for managing footprints and
    reputation.
  module: System Security
- sequence: 18
  category: Analysing simple logic circuits and logic expressions
  statement: >-
    Presented with a logic circuit or expression, learners isolate the different components and correctly
    express the possible output
  module: Data Manipulation 2
- sequence: 19
  category: Describing internal components of the computer
  statement: >-
    Provided with a situation with factors related to devices that are not peripherals, learners select
    devices or features of these devices that are coherent to the situation and justify their choice.
  module: Hardware and Software Systems 3
- sequence: 20
  category: Working on the Internet
  statement: >-
    Given a situation related to the use of the internet and its services, learners select appropriate
    service clearly justifying their choice
  module: Network Systems 2
- sequence: 21
  category: Getting application software
  statement: >-
    Provided with tasks to produce or edit digital content, learners choose the most appropriate software
    for each task clearly justifying their choice.
  module: Hardware and Software Systems 3
- sequence: 22
  category: Describing ways of acquiring and distributing software
  statement: Describe ways of acquiring or distributing software
  module: Hardware and Software Systems 3
- sequence: 23
  category: Examine licenses and copyright practices
  statement: >-
    Placed in a situation with issues related to intellectual property, learners propose ways of identifying
    free and copyrighted data or digital content, ways of protecting digital content and ways of using
    content protected by a given license. Proposals should be coherent with the situation and clearly
    justified.
  module: Ethics, Society and Legal Issues 3
